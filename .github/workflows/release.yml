name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 构建 Python SDK
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build wheel

      - name: Build SDK
        working-directory: openbene_sdk
        run: python -m build

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: openbene_sdk/dist/*

  # 构建 Flutter APK
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: openbot-mobile-control
        run: flutter pub get

      - name: Build APK
        working-directory: openbot-mobile-control
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: openbot-mobile-control/build/app/outputs/flutter-apk/app-release.apk

  # 创建 GitHub Release
  create-release:
    needs: [build-sdk, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: dist/sdk

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/apk

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/sdk/*.whl
            dist/sdk/*.tar.gz
            dist/apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

