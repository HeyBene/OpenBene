name: robot_app
description: Robot-side app for OpenBot HCI redesign.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  camera: ^0.11.0
  image: ^4.0.17
  sensors_plus: ^6.0.1
  battery_plus: ^6.0.3
  web_socket_channel: ^3.0.1
  mobile_scanner: ^5.2.3
  http: ^1.2.0
  async: ^2.12.0
  usb_serial: ^0.5.1
  flutter_blue_plus: ^1.35.3
  shared_preferences: ^2.5.3
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
