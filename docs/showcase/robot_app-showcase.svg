      <text x="88" y="66" text-anchor="middle" fill="#92400e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Telemetry</text>

      <text x="40" y="116" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Sensor Data</text>
      <text x="40" y="146" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Real-time monitoring</text>

      <rect x="40" y="178" width="130" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="70" cy="208" r="16" fill="#e0f2fe" />
      <rect x="64" y="202" width="12" height="12" rx="6" fill="#0ea5e9" />
      <text x="96" y="204" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Frames Sent</text>
      <text x="96" y="236" fill="#0284c7" font-family="Consolas, monospace" font-size="28" font-weight="800">124</text>

      <rect x="190" y="178" width="130" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <circle cx="220" cy="208" r="16" fill="#dcfce7" />
      <path d="M 214 208 L 220 198 L 226 208 L 220 220 Z" fill="#16a34a" />
      <text x="246" y="204" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Sensor Updates</text>
      <text x="246" y="236" fill="#16a34a" font-family="Consolas, monospace" font-size="28" font-weight="800">60</text>

      <rect x="40" y="300" width="280" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="60" y="330" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Battery Level</text>
      <text x="285" y="330" text-anchor="end" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">87%</text>
      <rect x="60" y="350" width="240" height="14" rx="7" fill="#e2e8f0" />
      <rect x="60" y="350" width="209" height="14" rx="7" fill="url(#accentGreen)" />
      <text x="60" y="386" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500">Device power status</text>

      <rect x="40" y="430" width="132" height="114" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="60" y="458" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Accelerometer</text>
      <rect x="60" y="476" width="14" height="46" rx="7" fill="#dbeafe" />
      <rect x="80" y="486" width="14" height="36" rx="7" fill="#bfdbfe" />
      <rect x="100" y="470" width="14" height="52" rx="7" fill="#60a5fa" />
      <text x="118" y="468" fill="#1d4ed8" font-family="Consolas, monospace" font-size="12" font-weight="700">X 0.12</text>
      <text x="118" y="488" fill="#0f766e" font-family="Consolas, monospace" font-size="12" font-weight="700">Y -0.03</text>
      <text x="118" y="508" fill="#9333ea" font-family="Consolas, monospace" font-size="12" font-weight="700">Z 9.81</text>

      <rect x="188" y="430" width="132" height="114" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="208" y="458" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Gyroscope</text>
      <rect x="208" y="476" width="14" height="32" rx="7" fill="#fbcfe8" />
      <rect x="228" y="468" width="14" height="40" rx="7" fill="#f9a8d4" />
      <rect x="248" y="482" width="14" height="26" rx="7" fill="#c084fc" />
      <text x="266" y="468" fill="#be185d" font-family="Consolas, monospace" font-size="12" font-weight="700">X 0.21</text>
      <text x="266" y="488" fill="#7c3aed" font-family="Consolas, monospace" font-size="12" font-weight="700">Y 0.18</text>
      <text x="266" y="508" fill="#a21caf" font-family="Consolas, monospace" font-size="12" font-weight="700">Z -0.04</text>
    </g>
  </g>

  <g transform="translate(112 884)">
    <rect x="0" y="0" width="1376" height="48" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#334155" stroke-opacity="0.6" />
    <text x="688" y="31" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
      WebSocket server • Live camera • Sensor telemetry • BLE / USB control • UDP auto-discovery
    </text>
  </g>
</svg>
